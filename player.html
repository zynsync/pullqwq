<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Kazumi 网页播放器</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; background: #000; color: #fff;
  font-family: "MiSans", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  overflow: hidden; }
button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font-family: inherit; }
.hidden { display: none !important; }

#entry { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 0%, #14202b 0%, #0b0f13 60%, #05070a 100%); padding: 20px; overflow: auto; }
.entryCard { width: 100%; max-width: 720px; background: #16191e; border: 1px solid #262b33;
  border-radius: 20px; padding: 28px; box-shadow: 0 24px 60px rgba(0,0,0,.55); }
.entryHead { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.entryLogo { width: 40px; height: 40px; border-radius: 12px; background: #00AEEC; color: #001018;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
.entryTitle { font-size: 22px; font-weight: 700; letter-spacing: .5px; }
.entrySub { color: #8b95a3; font-size: 13px; margin: 10px 0 22px; line-height: 1.7; }
.field { margin-bottom: 16px; }
.field > label { display: block; font-size: 13px; color: #9aa4b2; margin-bottom: 8px; }
.textInput, .areaInput { width: 100%; background: #1f242b; border: 1px solid #2c333d; color: #fff;
  border-radius: 10px; padding: 11px 12px; font-size: 14px; outline: none; }
.textInput:focus, .areaInput:focus { border-color: #00AEEC; }
.areaInput { min-height: 132px; resize: vertical; line-height: 1.6; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.entryRow { display: flex; gap: 12px; flex-wrap: wrap; }
.entryRow > .field { flex: 1 1 220px; }
.btnPrimary, .btnGhost { border-radius: 10px; padding: 12px 20px; font-size: 15px; font-weight: 600; }
.btnPrimary { background: #00AEEC; color: #001018; }
.btnPrimary:active { opacity: .85; }
.btnGhost { background: #232a33; color: #d5dde7; border: 1px solid #303845; }
.entryActions { display: flex; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.historyList { margin-top: 24px; border-top: 1px solid #242a32; padding-top: 16px; }
.historyItem { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: #c6cfda; }
.historyItem:hover { background: #1e242c; }
.historyItem span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: #6d7683; font-size: 12px; }

#player { position: fixed; inset: 0; background: #000; overflow: hidden; cursor: default;
  -webkit-user-select: none; user-select: none; }
#player.hideCursor { cursor: none; }
#stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  touch-action: none; }
#video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
#stage.r43 { }
#stage.r43 #video { width: auto; height: 100%; max-width: 100%; aspect-ratio: 4/3; object-fit: fill; }
#danmaku { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
#spinner { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
  border: 3px solid rgba(255,255,255,.22); border-top-color: #00AEEC; border-radius: 50%;
  animation: spin .9s linear infinite; z-index: 4; }
@keyframes spin { to { transform: rotate(360deg); } }

.scrim { position: absolute; left: 0; right: 0; pointer-events: none; z-index: 5;
  transition: opacity .3s ease, transform .3s ease; }
#scrimTop { top: 0; height: 50px; background: linear-gradient(180deg, rgba(0,0,0,.45), transparent); }
#scrimBottom { bottom: 0; height: 100px; background: linear-gradient(0deg, rgba(0,0,0,.45), transparent); }
.panelHidden .scrim { opacity: 0; }
.panelHidden #topBar { opacity: 0; transform: translateY(-100%); pointer-events: none; }
.panelHidden #bottomBar { opacity: 0; transform: translateY(100%); pointer-events: none; }
.panelHidden #rightControls { opacity: 0; transform: translateX(100%); pointer-events: none; }

#topBar { position: absolute; top: 0; left: 0; right: 0; z-index: 6; display: flex; align-items: center;
  gap: 2px; padding: 0 4px; transition: opacity .3s ease, transform .3s ease; }
#bottomBar { position: absolute; bottom: 0; left: 0; right: 0; z-index: 6; padding: 0 6px 4px;
  transition: opacity .3s ease, transform .3s ease; }
#rightControls { position: absolute; right: 4px; top: 0; bottom: 0; z-index: 6; display: flex;
  flex-direction: column; justify-content: center; gap: 6px; transition: opacity .3s ease, transform .3s ease; }

.iconBtn { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center;
  justify-content: center; flex: 0 0 auto; transition: background .15s ease; }
.iconBtn:hover { background: rgba(255,255,255,.14); }
.iconBtn svg { width: 24px; height: 24px; display: block; }
.iconBtn.small svg { width: 20px; height: 20px; }
.iconBtn:disabled { opacity: .5; cursor: default; }
.textBtn { padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.textBtn:hover { background: rgba(255,255,255,.14); }
#titleText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 16px; color: #fff; padding: 0 4px; }
.spinIcon svg { animation: spin .9s linear infinite; }

#transport { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; }
#progressRow { display: flex; align-items: center; gap: 10px; padding: 0 10px; }
#progress { position: relative; flex: 1; height: 32px; display: flex; align-items: center; cursor: pointer;
  touch-action: none; user-select: none; }
#progress .track { position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: rgba(255,255,255,.32); }
#progress .buffer { position: absolute; left: 0; height: 4px; border-radius: 2px; background: rgba(255,255,255,.5); }
#progress .played { position: absolute; left: 0; height: 4px; border-radius: 2px; background: #00AEEC; }
#progress .thumb { position: absolute; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%;
  background: #00AEEC; box-shadow: 0 0 0 0 rgba(0,174,236,.35); transition: box-shadow .15s ease; }
#progress:hover .thumb, #progress.dragging .thumb { box-shadow: 0 0 18px 6px rgba(0,174,236,.45); }
#progress .tlabel { position: absolute; bottom: 26px; font-size: 12px; font-variant-numeric: tabular-nums;
  color: #fff; background: rgba(0,0,0,.6); padding: 2px 6px; border-radius: 6px; white-space: nowrap; display: none; }
#progress .tlabel.left { left: 0; }
#progress .tlabel.right { right: 0; }
#progress.showLabels .tlabel { display: block; }

#controlRow { display: flex; align-items: center; gap: 2px; padding: 0 6px; }
#timeLabel { font-size: 16px; color: #fff; font-variant-numeric: tabular-nums; padding: 0 6px; white-space: nowrap; }
#centerControls { flex: 1; display: flex; align-items: center; justify-content: center; gap: 2px; min-width: 0; }
#danmakuInput { display: flex; align-items: center; max-width: 500px; width: 100%; height: 33px;
  background: rgba(255,255,255,.38); border-radius: 8px; padding: 0 4px 0 8px; margin: 0 4px; }
#danmakuInput input { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #fff; font-size: 15px; }
#danmakuInput input::placeholder { color: rgba(255,255,255,.6); }
#danmakuSend { background: #00AEEC; color: #001018; border-radius: 8px; padding: 5px 12px; font-size: 14px; font-weight: 600; }
#danmakuSend:disabled { background: rgba(255,255,255,.25); color: rgba(255,255,255,.6); }
.compact #timeLabel { font-size: 12px; padding: 0 4px; }
.compact #danmakuInput, .compact #centerControls .wideOnly { display: none; }

#hudLayer { position: absolute; left: 0; right: 0; top: 25px; z-index: 7; display: flex; justify-content: center;
  pointer-events: none; }
.hud { display: none; align-items: center; background: rgba(28,30,34,.94); border: 1px solid rgba(255,255,255,.12);
  border-radius: 30px; box-shadow: 0 12px 24px rgba(0,0,0,.28); }
.hud.show { display: flex; animation: hudIn .18s ease-out; }
@keyframes hudIn { from { opacity: 0; transform: translateY(-8px) scale(.92); } to { opacity: 1; transform: none; } }
#adjustHud { width: 200px; padding: 4px 8px; gap: 8px; }
#adjustHud .hudIcon { width: 32px; height: 32px; border-radius: 20px; background: rgba(0,174,236,.22);
  display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
#adjustHud .hudIcon svg { width: 20px; height: 20px; }
#adjustHud .hudBar { flex: 1; height: 32px; border-radius: 12px; background: rgba(255,255,255,.16); overflow: hidden; position: relative; }
#adjustHud .hudBar i { position: absolute; left: 0; top: 0; bottom: 0; background: #00AEEC; border-radius: 12px; }
#adjustHud .hudSep { width: 4px; height: 40px; border-radius: 2px; background: #fff; position: absolute;
  top: -4px; margin-left: -2px; }
#adjustHud.hideTrack .hudBar i { display: none; }
#seekHud { width: 248px; padding: 8px 10px; gap: 10px; border-radius: 30px; position: relative; overflow: hidden; }
#seekHud .hudBg { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,174,236,.22); }
#seekHud .hudIcon { width: 36px; height: 36px; border-radius: 20px; background: rgba(0,174,236,.22);
  display: flex; align-items: center; justify-content: center; flex: 0 0 auto; position: relative; z-index: 1; }
#seekHud .hudIcon svg { width: 22px; height: 22px; }
#seekHud .hudText { position: relative; z-index: 1; min-width: 0; }
#seekHud .hudText b { display: block; font-size: 14px; font-weight: 600; }
#seekHud .hudText s { display: block; text-decoration: none; font-size: 12px; color: rgba(255,255,255,.7); margin-top: 1px; }
#speedHud { width: 94px; padding: 4px 8px; gap: 6px; border-radius: 18px; }
#speedHud .hudIcon { width: 22px; height: 22px; border-radius: 12px; background: rgba(0,174,236,.22);
  display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
#speedHud .hudIcon svg { width: 15px; height: 15px; }
#speedHud .hudText { font-size: 13px; font-weight: 700; }

.menu { position: fixed; z-index: 40; min-width: 170px; background: #202429; border: 1px solid #2e343c;
  border-radius: 12px; padding: 6px; box-shadow: 0 18px 40px rgba(0,0,0,.5); animation: menuIn .12s ease-out; }
@keyframes menuIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.menuItem { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 12px; border-radius: 8px;
  font-size: 14px; color: #e6ebf1; text-align: left; }
.menuItem:hover { background: rgba(255,255,255,.1); }
.menuItem .tick { margin-left: auto; color: #00AEEC; font-size: 13px; }
.menuItem .arrow { margin-left: auto; color: #8b95a3; }
.menuTitle { padding: 8px 10px 6px; font-size: 12px; color: #8b95a3; }

#overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: flex;
  align-items: flex-end; justify-content: center; }
@media (min-width: 720px) { #overlay { align-items: center; } }
.sheet { width: 100%; max-width: 620px; max-height: 86vh; background: #1b1f24; border: 1px solid #2b323b;
  border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden;
  animation: sheetUp .22s ease-out; }
@media (min-width: 720px) { .sheet { border-radius: 20px; } }
@keyframes sheetUp { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheetHead { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
.sheetHead h3 { margin: 0; font-size: 17px; font-weight: 700; flex: 1; }
.sheetHead .sub { font-size: 12px; color: #8b95a3; font-weight: 400; margin-top: 3px; }
.tabs { display: flex; gap: 6px; padding: 4px 18px 0; }
.tab { flex: 1; text-align: center; padding: 9px 0; border-radius: 10px; font-size: 14px; color: #9aa4b2; }
.tab.active { background: #2a313a; color: #fff; font-weight: 600; }
.sheetBody { padding: 14px 18px 20px; overflow: auto; }
.section { margin-bottom: 18px; }
.section > h4 { margin: 0 0 6px; font-size: 13px; color: #00AEEC; font-weight: 600; }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 0; }
.row .lead { width: 22px; height: 22px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: #b9c3ce; }
.row .lead svg { width: 18px; height: 18px; }
.row .label { flex: 0 0 auto; font-size: 14px; }
.row .desc { font-size: 12px; color: #8b95a3; }
.row .val { margin-left: auto; font-size: 13px; color: #cfd7e0; font-variant-numeric: tabular-nums; }
.row input[type=range] { flex: 1; accent-color: #00AEEC; height: 24px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 0 10px; }
.chip { padding: 7px 14px; border-radius: 18px; border: 1px solid #39424d; color: #c3ccd6; font-size: 13px; }
.chip.on { background: rgba(0,174,236,.18); border-color: #00AEEC; color: #8fd8ff; }
.switch { position: relative; width: 44px; height: 26px; flex: 0 0 auto; margin-left: auto; }
.switch input { display: none; }
.switch span { position: absolute; inset: 0; border-radius: 13px; background: #3a424c; transition: background .18s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: #cfd7e0; transition: transform .18s, background .18s; }
.switch input:checked + span { background: rgba(0,174,236,.55); }
.switch input:checked + span::after { transform: translateX(18px); background: #00AEEC; }
.selList { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow: auto; }
.selItem { padding: 11px 12px; border-radius: 10px; background: #222830; font-size: 14px; text-align: left; }
.selItem:hover { background: #2a323c; }
.selItem small { display: block; color: #8b95a3; font-size: 12px; margin-top: 3px; }
.searchRow { display: flex; gap: 8px; margin-bottom: 12px; }
.searchRow input { flex: 1; background: #232a32; border: 1px solid #303844; border-radius: 10px;
  padding: 10px 12px; color: #fff; outline: none; font-size: 14px; }
.searchRow button { background: #00AEEC; color: #001018; border-radius: 10px; padding: 0 16px; font-weight: 600; }
.shieldTag { display: inline-flex; align-items: center; gap: 6px; background: #262d36; border: 1px solid #333b46;
  border-radius: 8px; padding: 6px 10px; font-size: 13px; margin: 0 6px 6px 0; }
.shieldTag b { font-weight: 500; }
.shieldTag i { font-style: normal; color: #ff8a8a; cursor: pointer; }
.epPanel { position: fixed; top: 0; right: 0; bottom: 0; width: 320px; max-width: 86vw; z-index: 30;
  background: #171b20; border-left: 1px solid #2b323b; padding: 16px; overflow: auto;
  animation: epIn .2s ease-out; }
@keyframes epIn { from { transform: translateX(100%); } to { transform: none; } }
.epPanel h3 { margin: 0 0 12px; font-size: 16px; }
.epItem { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px;
  font-size: 14px; color: #d3dbe4; margin-bottom: 6px; }
.epItem:hover { background: #222a33; }
.epItem.on { background: rgba(0,174,236,.16); color: #8fd8ff; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 80;
  background: rgba(0,0,0,.82); color: #fff; font-size: 14px; padding: 10px 18px; border-radius: 22px;
  max-width: 80vw; text-align: center; animation: hudIn .18s ease-out; }
</style>
</head>
<body>

<div id="entry">
  <div class="entryCard">
    <div class="entryHead">
      <div class="entryLogo">K</div>
      <div class="entryTitle">Kazumi 网页播放器</div>
    </div>
    <div class="entrySub">粘贴视频链接即可播放，支持 mp4 / m3u8 直链。每行一条链接即为一集，可挂载弹弹play 弹幕。</div>
    <div class="field">
      <label>标题</label>
      <input class="textInput" id="entryTitle" placeholder="留空则自动取链接文件名">
    </div>
    <div class="field">
      <label>视频链接（每行一集）</label>
      <textarea class="areaInput" id="entryLinks" placeholder="https://example.com/ep1.m3u8&#10;https://example.com/ep2.m3u8"></textarea>
    </div>
    <div class="entryRow">
      <div class="field">
        <label>Referer（可选）</label>
        <input class="textInput" id="entryReferer" placeholder="部分资源需要来源页">
      </div>
    </div>
    <div class="entryActions">
      <button class="btnPrimary" id="btnPlay">开始播放</button>
      <button class="btnGhost" id="btnPipEntry">以画中画打开</button>
    </div>
    <div class="historyList" id="historyList"></div>
  </div>
</div>

<div id="player" class="hidden panelHidden">
  <div id="stage">
    <video id="video" playsinline preload="metadata" crossorigin="anonymous"></video>
  </div>
  <canvas id="danmaku"></canvas>
  <div id="spinner" class="hidden"></div>

  <div id="hudLayer">
    <div class="hud" id="seekHud">
      <div class="hudBg"></div>
      <div class="hudIcon" id="seekIcon"></div>
      <div class="hudText"><b id="seekMain">00:00</b><s id="seekSub">00:00 / 00:00</s></div>
    </div>
    <div class="hud" id="speedHud">
      <div class="hudIcon" id="speedIcon"></div>
      <div class="hudText" id="speedText">2.0x</div>
    </div>
    <div class="hud" id="adjustHud">
      <div class="hudIcon" id="adjustIcon"></div>
      <div class="hudBar"><i id="adjustFill"></i><div class="hudSep" id="adjustSep"></div></div>
    </div>
  </div>

  <div class="scrim" id="scrimTop"></div>
  <div class="scrim" id="scrimBottom"></div>

  <div id="topBar"></div>

  <div id="rightControls">
    <button class="iconBtn" id="btnShot" title="截图"></button>
    <button class="iconBtn" id="btnLock" title="锁定面板"></button>
  </div>

  <div id="bottomBar">
    <div id="transport">
      <div id="aboveTime"></div>
      <div id="progressRow">
        <div id="progress">
          <div class="track"></div>
          <div class="buffer"></div>
          <div class="played"></div>
          <div class="thumb"></div>
          <div class="tlabel left"></div>
          <div class="tlabel right"></div>
        </div>
      </div>
      <div id="controlRow"></div>
    </div>
  </div>
</div>

<div id="overlayHost"></div>
<div id="menuHost"></div>
<div id="toastHost"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

    this.rows = Math.max(1, Math.floor(this.H * this.option.area / (this.option.fontSize * this.option.lineHeight)));

  DanmakuEngine.prototype.clear = function () {

    this.bottomTracks = [];

    var now = performance.now();
    var D = this.option.duration * 1000;
    var speed = (this.W + w) / (D / 1000);
    for (var i = 0; i < this.rows; i++) {
      var t = this.scrollTracks[i];
      if (!t) { this.scrollTracks[i] = { w: w, speed: speed, t0: now }; return i; }
      var dt = (now - t.t0) / 1000;
      if (dt >= D / 1000) { this.scrollTracks[i] = { w: w, speed: speed, t0: now }; return i; }
      if (this.option.massiveMode) continue;
      var entered = dt >= (t.w / t.speed);
      if (entered && speed * (D / 1000 - dt) <= t.speed * (D / 1000)) {
        this.scrollTracks[i] = { w: w, speed: speed, t0: now };
        return i;
      }
    }
    if (this.option.massiveMode) {
      var idx = Math.floor(Math.random() * this.rows);
      return idx;
    }
    return -1;
  };
  DanmakuEngine.prototype.allocFixed = function (bucket) {
    var now = performance.now();
    var D = this.option.duration * 1000;
    for (var i = 0; i < this.rows; i++) {
      var t = bucket[i];
      if (!t || now - t >= D) { bucket[i] = now; return i; }
    }

  DanmakuEngine.prototype.add = function (text, color, type) {
    if (text === undefined || text === null) return;
    text = String(text);
    if (isBlocked(text)) return;

    var isScroll = type !== 4 && type !== 5;
    if (isScroll && opt.hideScroll) return;
    if (type === 5 && opt.hideTop) return;
    if (type === 4 && opt.hideBottom) return;
    var lh = this.lineHeight();
    this.ctx.font = this.font();
    var w = this.ctx.measureText(text).width;
    var track, y;
    if (isScroll) {
      track = this.allocScroll(w);
      if (track < 0) return;
      y = track * lh;
    } else if (type === 5) {
      track = this.allocFixed(this.topTracks);
      if (track < 0) return;
      y = track * lh;
    } else {
      track = this.allocFixed(this.bottomTracks);
      if (track < 0) return;
      y = this.H - (track + 1) * lh;
    }
    this.items.push({
      text: text, color: color || "#fff", type: type || 1, w: w,
      x: isScroll ? this.W : (this.W - w) / 2,
      y: y, t0: performance.now(),
      dur: opt.duration * (isScroll ? 1 : 1) * 1000

  };
  DanmakuEngine.prototype.font = function () {
    var weight = Math.max(1, Math.min(9, this.option.fontWeight || 4)) * 100;

    var alive = [];
    for (var i = 0; i < this.items.length; i++) {
      var it = this.items[i];
      var p = (now - it.t0) / it.dur;
      if (p >= 1) continue;
      var x;
      if (it.type === 4 || it.type === 5) {
        x = it.x;
      } else {
        x = this.W - (this.W + it.w) * p;
      }
      it.dx = x;
      if (opt.strokeWidth > 0) {
        ctx.lineWidth = opt.strokeWidth;
        ctx.strokeStyle = "#000";
        ctx.strokeText(it.text, x, it.y);
      }
      ctx.fillStyle = it.color;
      ctx.fillText(it.text, x, it.y);
      alive.push(it);
    }

    ctx.globalAlpha = 1;

  function normalizeText(text) {
    var s = text.trim().toLowerCase();
    var out = "";
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c === 0x3000) out += " ";
      else if (c >= 0xff01 && c <= 0xff5e) out += String.fromCharCode(c - 0xfee0);
      else out += s.charAt(i);
    }
    out = out.replace(/\s+/g, "");
    out = out.replace(/[^\w\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\u31f0-\u31ff\uff65-\uff9f]/g, "");
    out = out.replace(/(.)\1{2,}/g, "$1$1$1");
    return out;
  }

  function mergeDuplicate(list, windowSeconds) {
    var groups = {};
    var order = [];
    list.forEach(function (d) {
      var key = normalizeText(d.message);
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(d);
    });
    var result = [];
    order.forEach(function (key) {
      var arr = groups[key];
      if (!arr.length) return;
      if (arr.length === 1) { result.push(arr[0]); return; }
      arr.sort(function (a, b) { return a.time - b.time; });
      var cur = [];
      arr.forEach(function (item) {
        if (!cur.length) { cur.push(item); return; }
        if (item.time - cur[cur.length - 1].time <= windowSeconds) cur.push(item);
        else { flush(cur); cur = [item]; }
      });
      flush(cur);
      function flush(g) {
        if (!g.length) return;
        if (g.length === 1) { result.push(g[0]); return; }
        result.push({ message: g[0].message + " x" + g.length, time: g[0].time, type: 1, color: "#ffffff", source: g[0].source });
      }
    });
    return result;
  }

  function setDanmakuData(entries) {

  function emitForSecond(sec) {
    if (state.emitted[sec]) return;
    state.emitted[sec] = true;
    var list = state.danmaku.map[sec];
    if (!list || !list.length) return;
    var total = list.length;
    for (var i = 0; i < total; i++) {
      (function (d, delay) {
        setTimeout(function () {
          if (!state.danmaku.on || E.video.paused) return;
          var color = SETTINGS.danmakuColor ? d.color : "#ffffff";
          engine.add(d.message, color, d.type);
        }, delay);
      })(list[i], Math.floor(i * 1000 / total));
    }
  }

  function danmakuTick() {
    requestAnimationFrame(danmakuTick);

    if (!state.danmaku.on || E.video.paused || !E.video.duration) return;
    var offset = SETTINGS.danmakuTimeOffset || 0;
    var sec = Math.floor(E.video.currentTime - offset);
    if (sec < 0) return;
    if (sec !== state.lastSecond) {

        emitForSecond(sec);
      }
      state.lastSecond = sec;
    }
  }

        var parts = String(c.p || "").split(",");
        return {
          message: c.m,
          time: parseFloat(parts[0] || "0"),
          type: parseInt(parts[1] || "1", 10),
          color: "#" + ("000000" + parseInt(parts[2] || "16777215", 10).toString(16)).slice(-6),
          source: parts[3] || ""

      }).filter(function (d) { return d.message && !isBlocked(d.message); });
      setDanmakuData(entries);
      state.danmaku.loading = false;
      state.danmaku.on = true;
      SETTINGS.danmakuEnabledByDefault = true;

  function loadSource(url) {
    state.url = url;
    var proxied = "/api/proxy?url=" + encodeURIComponent(url) + (state.referer ? "&referer=" + encodeURIComponent(state.referer) : "");
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    hlsRetries = 0;
    var isM3u8 = /\.m3u8(\?|$)/i.test(url) || url.indexOf("m3u8") !== -1;
    markLoadStart();
    if (isM3u8 && window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls({
        lowLatencyMode: false,
        enableWorker: true,
        manifestLoadingTimeOut: 60000,
        manifestLoadingMaxRetry: 6,
        manifestLoadingRetryDelay: 1000,
        levelLoadingTimeOut: 60000,
        levelLoadingMaxRetry: 8,
        fragLoadingTimeOut: 60000,
        fragLoadingMaxRetry: 10
      });
      hls.loadSource(proxied);
      hls.attachMedia(E.video);
      hls.on(window.Hls.Events.ERROR, function (evt, data) {
        if (!data || !data.fatal) return;
        if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR && hlsRetries < 4) {
          hlsRetries++;
          markLoadStart();
          setTimeout(function () {
            if (!hls) return;
            try { hls.loadSource(proxied); hls.startLoad(); } catch (e) {}
          }, 900 * hlsRetries);
          return;
        }
        if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR && hlsRetries < 4) {
          hlsRetries++;
          try { hls.recoverMediaError(); } catch (e) {}
          return;
        }
        markLoadEnd();
        toast("视频加载失败");
      });
    } else {
      E.video.src = proxied;
    }
    state.lastSrc = url;
    resetDanmakuTimeline();
  }

  function switchEpisode(index) {
    if (index < 0 || index >= state.episodes.length) { toast(index >= state.episodes.length ? "已经是最新一集" : "已经是第一集"); return; }
    var old = state.episodes[state.index];
    var oldTime = E.video.currentTime;
    if (old) old.progress = oldTime;
    state.index = index;
    var ep = state.episodes[index];
    var resume = ep.progress && ep.progress > 5 && (!ep.duration || ep.progress < ep.duration - 5) ? ep.progress : 0;
    E.spinner.classList.remove("hidden");
    loadSource(ep.url);
    if (resume) {
      E.video.addEventListener("loadedmetadata", function once() {
        E.video.removeEventListener("loadedmetadata", once);
        E.video.currentTime = resume;
        E.video.play().catch(function () {});
      });
    } else {
      E.video.play().catch(function () {});
    }
    buildTopBar();
    updateTitle();
    toast("正在加载 " + ep.title);
  }

  function updateTitle() {
    var ep = state.episodes[state.index];
    var t = $("#titleText");
    if (t) t.textContent = " " + state.title + (ep ? " [" + ep.title + "]" : "");
  }

  function startPlayback(title, links, referer, pipMode) {
    var lines = links.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    if (!lines.length) { toast("请至少输入一条链接"); return; }
    state.title = title || guessTitle(lines[0]);
    state.referer = referer || "";
    state.episodes = lines.map(function (u, i) { return { url: u, title: "第 " + (i + 1) + " 集" }; });
    state.index = 0;
    E.entry.classList.add("hidden");
    E.player.classList.remove("hidden");
    buildTopBar();
    buildBottomBar();
    updateTitle();
    if (!engine) engine = new DanmakuEngine(E.danmaku);
    applyEngineOptions();
    applyAspect();
    applySuperResolution();
    loadSource(state.episodes[0].url);
    state.danmaku.on = !!SETTINGS.danmakuEnabledByDefault && state.danmaku.count > 0;
    updateCenterButtons();
    showPanel(true);
    E.video.play().catch(function () {});
    pushHistory({ title: state.title, episodes: lines, referer: state.referer, time: Date.now() });
    if (pipMode) togglePip();
    if (!state.danmaku.count) toast("未加载弹幕，点弹幕按钮可手动匹配");
  }

  function guessTitle(url) {
    try {
      var p = new URL(url);
      var name = decodeURIComponent(p.pathname.split("/").filter(Boolean).pop() || "视频");
      return name.replace(/\.[a-z0-9]+$/i, "");
    } catch (e) { return "视频"; }
  }

  function leavePlayer() {
    E.video.pause();
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    clearTimeout(loadTimer);
    loadTimer = null;
    hlsRetries = 0;
    E.video.removeAttribute("src");
    E.video.load();
    E.spinner.classList.add("hidden");
    clearDanmaku();
    closeMenus();
    var p = document.getElementById("epPanel");
    if (p) p.remove();
    E.player.classList.add("hidden");
    E.entry.classList.remove("hidden");
    renderHistory();
  }

  function renderHistory() {
    var list = readHistory();
    E.historyList.innerHTML = "";
    if (!list.length) return;
    E.historyList.appendChild(el("div", "muted", "最近播放"));
    list.forEach(function (item) {
      var div = el("div", "historyItem");
      div.innerHTML = '<span>' + item.title + '</span><span class="muted">' + item.episodes.length + " 集</span>";
      div.addEventListener("click", function () {
        E.entryTitle.value = item.title;
        E.entryLinks.value = item.episodes.join("\n");
        E.entryReferer.value = item.referer || "";
      });
      E.historyList.appendChild(div);
    });
  }

  var panelHideTimer = null;
  function showPanel(force) {
    if (state.locked && !force) return;
    E.player.classList.remove("panelHidden");
    clearTimeout(panelHideTimer);
    panelHideTimer = setTimeout(function () {
      if (state.locked) return;
      if (document.getElementById("epPanel")) return;
      if (menuHost().children.length) return;
      E.player.classList.add("panelHidden");
    }, SETTINGS.panelHideTime);
  }

  function flashCursor() {
    E.player.classList.remove("hideCursor");
    clearTimeout(state.hideCursorTimer);
    state.hideCursorTimer = setTimeout(function () {
      if (document.fullscreenElement) E.player.classList.add("hideCursor");
    }, 2000);
  }

  function showSpeedHud() {
    E.speedText.textContent = state.speed.toFixed(1) + "x";
    E.speedHud.classList.add("show");
    clearTimeout(E.speedHud._t);
    E.speedHud._t = setTimeout(function () { E.speedHud.classList.remove("show"); }, 2000);
  }

  function showAdjustHud(type, value) {
    E.adjustIcon.innerHTML = type === "volume" ? icon("volume") : icon("brightness");
    E.adjustFill.style.width = Math.round(value * 100) + "%";
    E.adjustSep.style.left = Math.round(value * 100) + "%";
    E.adjustHud.classList.add("show");
    clearTimeout(state.adjustTimer);
    state.adjustTimer = setTimeout(function () { E.adjustHud.classList.remove("show"); }, 2000);
  }

  function showSeekHud(visible) {
    if (!visible) { E.seekHud.classList.remove("show"); return; }
    var off = state.seekDirection >= 0 ? "+" : "-";
    var diff = Math.abs(state.seekTarget - (E.video.currentTime || 0));
    E.seekMain.textContent = state.seekCancelPending ? "松开取消" : (off + fmt(diff));
    E.seekSub.textContent = state.seekCancelPending ? "移回画面继续调整"
      : fmt(state.seekTarget) + " / " + fmt(E.video.duration || 0);
    E.seekIcon.innerHTML = icon("forward");
    E.seekIcon.style.transform = state.seekDirection >= 0 ? "none" : "scaleX(-1)";
    var bg = E.seekHud.querySelector(".hudBg");
    if (bg) bg.style.width = (E.video.duration ? Math.max(0, Math.min(1, state.seekTarget / E.video.duration)) * 100 : 0) + "%";
    E.seekHud.classList.add("show");
  }

  function hidePanel() {
    clearTimeout(panelHideTimer);
    E.player.classList.add("panelHidden");
  }

  function togglePanel() {
    if (E.player.classList.contains("panelHidden")) showPanel(true);
    else hidePanel();
  }

  function updateProgress() {
    var d = E.video.duration || 0;
    var c = E.video.currentTime || 0;
    if (!state.seekDragging) {
      var ratio = d ? Math.max(0, Math.min(1, c / d)) : 0;
      var played = E.progress.querySelector(".played");
      var thumb = E.progress.querySelector(".thumb");
      if (played) played.style.width = (ratio * 100) + "%";
      if (thumb) thumb.style.left = (ratio * 100) + "%";
    }
    var bufEnd = 0;
    try { if (E.video.buffered && E.video.buffered.length) bufEnd = E.video.buffered.end(E.video.buffered.length - 1); } catch (e) {}
    var buffer = E.progress.querySelector(".buffer");
    if (buffer) buffer.style.width = (d ? Math.max(0, Math.min(1, bufEnd / d)) * 100 : 0) + "%";
    var tl = document.getElementById("timeLabel");
    if (tl) tl.textContent = fmt(c) + " / " + fmt(d);
  }

  function setVolume(v) {
    state.volume = Math.max(0, Math.min(1, isFinite(v) ? v : state.volume));
    E.video.volume = state.volume;
    E.video.muted = state.volume <= 0.001;
  }

  function applyBrightness() {
    E.stage.style.filter = state.brightness >= 0.999 ? "" : "brightness(" + Math.max(0.05, state.brightness) + ")";
  }

  function bindProgress() {
    var dragging = false;
    function timeAt(clientX) {
      var r = E.progress.getBoundingClientRect();
      var p = Math.max(0, Math.min(1, (clientX - r.left) / (r.width || 1)));
      return p * (E.video.duration || 0);
    }
    function paint(clientX) {
      var d = E.video.duration || 0;
      var t = timeAt(clientX);
      state.seekTarget = t;
      var played = E.progress.querySelector(".played");
      var thumb = E.progress.querySelector(".thumb");
      var ratio = d ? t / d : 0;
      if (played) played.style.width = (ratio * 100) + "%";
      if (thumb) thumb.style.left = (ratio * 100) + "%";
      var lbl = E.progress.querySelector(".tlabel.left");
      if (lbl) lbl.textContent = fmt(t);
      var tl = document.getElementById("timeLabel");
      if (tl) tl.textContent = fmt(t) + " / " + fmt(d);
    }
    E.progress.addEventListener("pointerdown", function (e) {
      if (!E.video.duration) return;
      dragging = true;
      state.seekDragging = true;
      E.progress.classList.add("dragging", "showLabels");
      try { E.progress.setPointerCapture(e.pointerId); } catch (err) {}
      var right = E.progress.querySelector(".tlabel.right");
      if (right) right.textContent = fmt(E.video.duration);
      paint(e.clientX);
      e.preventDefault();
      e.stopPropagation();
    });
    E.progress.addEventListener("pointermove", function (e) { if (dragging) paint(e.clientX); });
    function done(e) {
      if (!dragging) return;
      dragging = false;
      state.seekDragging = false;
      E.progress.classList.remove("dragging", "showLabels");
      if (e.type === "pointerup") seekTo(timeAt(e.clientX));
      showPanel();
    }
    E.progress.addEventListener("pointerup", done);
    E.progress.addEventListener("pointercancel", done);
  }

  function bindVideoEvents() {
    E.video.addEventListener("play", function () { updatePlayIcon(); showPanel(); flashCursor(); });
    E.video.addEventListener("pause", function () { updatePlayIcon(); showPanel(true); });
    E.video.addEventListener("timeupdate", updateProgress);
    E.video.addEventListener("progress", updateProgress);
    E.video.addEventListener("loadedmetadata", function () { markLoadEnd(); updateProgress(); });
    E.video.addEventListener("loadeddata", function () { markLoadEnd(); });
    E.video.addEventListener("canplay", function () { markLoadEnd(); });
    E.video.addEventListener("playing", function () { markLoadEnd(); });
    E.video.addEventListener("waiting", function () { E.spinner.classList.remove("hidden"); });
    E.video.addEventListener("stalled", function () { if (!E.video.paused) E.spinner.classList.remove("hidden"); });
    E.video.addEventListener("error", function () {
      if (E.video.error && E.video.error.code === 1) return;
      if (loadTimer) return;
      markLoadStart();
    });
    E.video.addEventListener("ended", function () {
      markLoadEnd();
      if (SETTINGS.autoPlayNext && state.index < state.episodes.length - 1) switchEpisode(state.index + 1);
    });
  }

  function bindStageGestures() {
    var g = null;
    var longTimer = null;
    var singleTimer = null;
    var lastTap = 0;

    function clearLong() {
      if (longTimer) { clearTimeout(longTimer); longTimer = null; }
    }

    function tap(touch) {
      if (document.getElementById("overlayHost").children.length) return;
      if (menuHost().children.length) { closeMenus(); return; }
      var now = Date.now();
      if (now - lastTap < 300) {
        lastTap = 0;
        if (singleTimer) { clearTimeout(singleTimer); singleTimer = null; }
        if (touch) togglePlay();
        else if (!state.locked) toggleFullscreen();
        return;
      }
      lastTap = now;
      clearTimeout(singleTimer);
      singleTimer = setTimeout(function () {
        singleTimer = null;
        if (touch) { if (state.locked) showPanel(true); else togglePanel(); }
        else togglePlay();
      }, 260);
    }

    E.stage.addEventListener("pointerdown", function (e) {
      if (e.button && e.button !== 0) return;
      if (document.getElementById("overlayHost").children.length) return;
      var touch = e.pointerType !== "mouse";
      g = {
        touch: touch,
        x0: e.clientX,
        y0: e.clientY,
        startTime: E.video.currentTime || 0,
        startSpeed: state.speed,
        startVolume: state.volume,
        startBrightness: state.brightness,
        mode: null,
        moved: false,
        long: false,
        pending: false
      };
      clearLong();
      if (touch && !state.locked) {
        longTimer = setTimeout(function () {
          longTimer = null;
          if (!g || g.moved || g.mode) return;
          g.long = true;
          state.lastSpeed = state.speed;
          setSpeed(SETTINGS.defaultShortcutForwardPlaySpeed);
          showSpeedHud();
        }, 480);
      }
    });

    E.stage.addEventListener("pointermove", function (e) {
      if (!g || g.long) return;
      var dx = e.clientX - g.x0;
      var dy = e.clientY - g.y0;
      if (!g.moved && Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      clearLong();
      g.moved = true;
      if (!g.touch || state.locked) return;
      if (!g.mode) {
        g.mode = Math.abs(dx) >= Math.abs(dy) ? "seek" : "adjust";
        if (g.mode === "seek") {
          state.seekTarget = g.startTime;
          state.seekDirection = 0;
          state.seekCancelPending = false;
        } else {
          g.adjustType = e.clientX < window.innerWidth / 2 ? "brightness" : "volume";
        }
      }
      if (g.mode === "seek") {
        var edge = e.clientX <= 0 || e.clientY <= 0 ||
          e.clientX >= window.innerWidth || e.clientY >= window.innerHeight;
        if (edge) {
          g.pending = true;
        } else {
          if (g.pending) { g.pending = false; g.x0 = e.clientX; g.startTime = state.seekTarget; }
          dx = e.clientX - g.x0;
          state.seekDirection = dx === 0 ? state.seekDirection : (dx > 0 ? 1 : -1);
          state.seekTarget = Math.max(0, Math.min(E.video.duration || 0,
            g.startTime + dx * (180 / Math.max(1, window.innerWidth))));
        }
        state.seekCancelPending = g.pending;
        showSeekHud(true);
        return;
      }
      if (!SETTINGS.brightnessVolumeGesture) return;
      if (g.adjustType === "brightness") {
        state.brightness = Math.max(0, Math.min(1, g.startBrightness - dy / (window.innerHeight * 2)));
        applyBrightness();
        showAdjustHud("brightness", state.brightness);
      } else {
        setVolume(g.startVolume - dy / (window.innerHeight * 0.03));
        showAdjustHud("volume", state.volume);
      }
    });

    function finish(e) {
      if (!g) return;
      var gg = g;
      g = null;
      clearLong();
      if (gg.long) { setSpeed(gg.startSpeed); showSpeedHud(); return; }
      if (gg.mode === "seek") {
        showSeekHud(false);
        state.seekDragging = false;
        if (!state.seekCancelPending && gg.moved) seekTo(state.seekTarget);
        state.seekCancelPending = false;
        state.seekDirection = 0;
        state.seekTarget = E.video.currentTime || 0;
        showPanel();
        return;
      }
      if (gg.mode === "adjust") { showPanel(); return; }
      if (gg.moved) return;
      tap(gg.touch);
    }
    E.stage.addEventListener("pointerup", finish);
    E.stage.addEventListener("pointercancel", function () {
      if (!g) return;
      clearLong();
      if (g.long) setSpeed(g.startSpeed);
      if (g.mode === "seek") { showSeekHud(false); state.seekCancelPending = false; state.seekDirection = 0; }
      g = null;
    });

    E.stage.addEventListener("wheel", function (e) {
      if (document.getElementById("overlayHost").children.length) return;
      e.preventDefault();
      setVolume(state.volume + (e.deltaY > 0 ? -0.05 : 0.05));
      showAdjustHud("volume", state.volume);
    }, { passive: false });
  }

  function bindKeyboard() {
    document.addEventListener("keydown", function (e) {
      var tag = document.activeElement ? document.activeElement.tagName : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      if (E.entry && !E.entry.classList.contains("hidden")) return;
      if (document.getElementById("overlayHost").children.length) {
        if (e.key === "Escape") { e.preventDefault(); closeSheet(); }
        return;
      }
      if (menuHost().children.length) {
        if (e.key === "Escape") { e.preventDefault(); closeMenus(); }
        return;
      }
      var k = e.key;
      if (k === " ") { e.preventDefault(); togglePlay(); return; }
      if (k === "ArrowRight") {
        e.preventDefault();
        if (e.repeat && !state.arrowLong) {
          state.arrowLong = true;
          state.lastSpeed = state.speed;
          setSpeed(SETTINGS.defaultShortcutForwardPlaySpeed);
          showSpeedHud();
        }
        return;
      }
      if (k === "ArrowLeft") { e.preventDefault(); seekBy(-SETTINGS.arrowKeySkipTime); return; }
      if (k === "ArrowUp") { e.preventDefault(); setVolume(state.volume + 0.05); showAdjustHud("volume", state.volume); return; }
      if (k === "ArrowDown") { e.preventDefault(); setVolume(state.volume - 0.05); showAdjustHud("volume", state.volume); return; }
      if (k === "n" || k === "N") { switchEpisode(state.index + 1); return; }
      if (k === "p" || k === "P") { switchEpisode(state.index - 1); return; }
      if (k === "m" || k === "M") {
        E.video.muted = !E.video.muted;
        state.volume = E.video.muted ? 0 : (E.video.volume || 1);
        showAdjustHud("volume", state.volume);
        return;
      }
      if (k === "f" || k === "F") { toggleFullscreen(); return; }
      if (k === "Escape") { if (document.fullscreenElement) document.exitFullscreen(); return; }
      if (k === "d" || k === "D") { toggleDanmaku(); return; }
      if (k === "s" || k === "S") { screenshot(); return; }
      if (k === "k" || k === "K") { toast("暂无跳过信息"); return; }
      if (k === "1") { setSpeed(1); showSpeedHud(); return; }
      if (k === "2") { setSpeed(2); showSpeedHud(); return; }
      if (k === "3") { setSpeed(3); showSpeedHud(); return; }
      if (k === "x" || k === "X") { speedStep(1); return; }
      if (k === "z" || k === "Z") { speedStep(-1); return; }
    });
    document.addEventListener("keyup", function (e) {
      if (e.key !== "ArrowRight") return;
      if (tagBlocked()) return;
      if (state.arrowLong) {
        state.arrowLong = false;
        setSpeed(state.lastSpeed);
        showSpeedHud();
      } else {
        seekBy(SETTINGS.arrowKeySkipTime);
      }
    });
    function tagBlocked() {
      var tag = document.activeElement ? document.activeElement.tagName : "";
      return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" ||
        (E.entry && !E.entry.classList.contains("hidden"));
    }
  }

  function bindEntry() {
    var pipEntry = document.getElementById("btnPipEntry");
    function start(pip) {
      startPlayback(E.entryTitle.value.trim(), E.entryLinks.value, E.entryReferer.value.trim(), pip);
    }
    E.btnPlay.addEventListener("click", function () { start(false); });
    if (pipEntry) pipEntry.addEventListener("click", function () { start(true); });
    E.entryLinks.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") start(false);
    });
  }

  function boot() {
    if (MOBILE) E.player.classList.add("compact");
    if (typeof state.volume !== "number") state.volume = 1;
    if (typeof state.brightness !== "number") state.brightness = 1;
    state.arrowLong = false;
    E.btnShot.innerHTML = icon("camera");
    E.btnShot.title = "截图";
    E.btnShot.addEventListener("click", screenshot);
    E.btnLock.innerHTML = icon("unlock");
    E.btnLock.title = "锁定面板";
    E.btnLock.addEventListener("click", function () {
      state.locked = !state.locked;
      updatePlayIcon();
      toast(state.locked ? "面板已锁定" : "面板已解锁");
      showPanel(true);
    });
    bindEntry();
    bindVideoEvents();
    bindProgress();
    bindStageGestures();
    bindKeyboard();
    renderHistory();
    updateProgress();
    if (engine) applyEngineOptions();
    E.player.addEventListener("mousemove", function (e) {
      if (e.pointerType && e.pointerType !== "mouse") return;
      if (state.locked) { showPanel(true); return; }
      if (!E.player.classList.contains("hidden")) showPanel(true);
      flashCursor();
    });
    document.addEventListener("fullscreenchange", function () { updatePlayIcon(); flashCursor(); });
  }

  boot();
})();
</script>
</body>
</html>
